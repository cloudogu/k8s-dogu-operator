global:
  imagePullSecrets:
    - name: "ces-container-registries"
  networkPolicies:
    enabled: true
  timezone: "Europe/Berlin"
additionalImages:
  # chownInitImage will be used to change file permissions on writeable dogu volumes
  chownInitImage: busybox:1.36
  # exporterImage will be used as sidecar container if the export-mode of a dogu is active
  exporterImage: registry.cloudogu.com/k8s/rsync-sidecar:1.1.0
  # additionalMountsInitContainerImage will be used as init container if the dogu mounts additional data
  additionalMountsInitContainerImage: cloudogu/dogu-additional-mounts-init:0.1.3
controllerManager:
  image:
    registry: docker.io
    repository: cloudogu/k8s-dogu-operator
    tag: 3.27.2
  imagePullPolicy: IfNotPresent
  env:
    logLevel: debug
    stage: development
    authRegistrationEnabled: false
    expositionEnabled: false
    warpMenuEntryEnabled: false
    disablePostfixDependencyCheck: false
    doguStartupProbeTimeout: 1
    doguRestartSuccessfulHistoryLimit: 3
    doguRestartFailedHistoryLimit: 3
    doguRestartGarbageCollectionDisabled: false
    doguDescriptorMaxRetries: 20
    getServiceAccountPodMaxRetries: 5
    requeueTimeForDoguResourceInNanoseconds: 5000000000
  resourceLimits:
    memory: 105M
  resourceRequests:
    cpu: 15m
    memory: 105M

reloader:
  enabled: false
  global:
    imagePullSecrets:
      - name: "ces-container-registries"
  # V3 Dogus are installed as Helm charts via flux, which is incompatible with the default reload strategy
  reloadStrategy: annotations
  # watch only namespaces that are listed here + the release namespace
  watchGlobally: false
  namespaces: []
  # TODO evaluate if these are the annotations we want to use
  custom_annotations:
    auto: "k8s.cloudogu.com/reload"
    configmap_auto: "k8s.cloudogu.com/reload-configmaps-auto"
    secret_auto: "k8s.cloudogu.com/reload-secrets-auto"
    configmap: "k8s.cloudogu.com/reload-configmaps"
    secret: "k8s.cloudogu.com/reload-secrets"
    search: "k8s.cloudogu.com/reload-search"
    match: "k8s.cloudogu.com/reload-match"
    ignore: "k8s.cloudogu.com/reload-exclude"
    pausePeriod: "k8s.cloudogu.com/reload-pause-period"
    pauseTime: "k8s.cloudogu.com/reload-paused-at"
