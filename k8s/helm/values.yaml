global:
  imagePullSecrets:
    - name: "ces-container-registries"
  networkPolicies:
    enabled: true
  timezone: "Europe/Berlin"
additionalImages:
  # chownInitImage will be used to change file permissions on writeable dogu volumes
  chownInitImage: busybox:1.36
  # exporterImage will be used as sidecar container if the export-mode of a dogu is active
  exporterImage: registry.cloudogu.com/k8s/rsync-sidecar:1.1.0
  # additionalMountsInitContainerImage will be used as init container if the dogu mounts additional data
  additionalMountsInitContainerImage: cloudogu/dogu-additional-mounts-init:0.1.3
controllerManager:
  image:
    registry: docker.io
    repository: cloudogu/k8s-dogu-operator
    tag: 3.27.2
  imagePullPolicy: IfNotPresent
  env:
    logLevel: debug
    stage: development
    authRegistrationEnabled: false
    expositionEnabled: false
    warpMenuEntryEnabled: false
    disablePostfixDependencyCheck: false
    doguStartupProbeTimeout: 1
    doguRestartSuccessfulHistoryLimit: 3
    doguRestartFailedHistoryLimit: 3
    doguRestartGarbageCollectionDisabled: false
    doguDescriptorMaxRetries: 20
    getServiceAccountPodMaxRetries: 5
    requeueTimeForDoguResourceInNanoseconds: 5000000000
  resourceLimits:
    memory: 105M
  resourceRequests:
    cpu: 15m
    memory: 105M
reloader:
  enabled: false
  global:
    imagePullSecrets:
      - name: "ces-container-registries"
  reloader:
    # V3 Dogus are installed as Helm charts via flux, which is incompatible with the default reload strategy
    reloadStrategy: annotations
    # Custom annotations so that we stay independent of the stakater reloader.
    # In the future, stakater reloader might be replaced by our own implementation.
    custom_annotations:
      # To be used on workloads. If any ConfigMaps or Secrets that are referenced by the workload change,
      # the workload will be restarted.
      # Value can be "true" or "false".
      auto: "k8s.cloudogu.com/reload-auto"
      # To be used on workloads. If any ConfigMaps that are referenced by the workload change,
      # the workload will be restarted. Secret changes are ignored.
      # Value can be "true" or "false".
      configmap_auto: "k8s.cloudogu.com/reload-configmaps-auto"
      # To be used on workloads. If any Secrets that are referenced by the workload change,
      # the workload will be restarted. ConfigMap changes are ignored.
      # Value can be "true" or "false".
      secret_auto: "k8s.cloudogu.com/reload-secrets-auto"
      # To be used on workloads. If any ConfigMaps that are referenced by this annotation change,
      # the workload will be restarted. Secret changes and ConfigMaps not in this annotation are ignored.
      # Value is a comma-separated list of ConfigMap names.
      configmap: "k8s.cloudogu.com/reload-configmaps"
      # To be used on workloads. If any Secrets that are referenced by this annotation change,
      # the workload will be restarted. ConfigMaps changes and Secrets not in this annotation are ignored.
      # Value is a comma-separated list of Secret names.
      secret: "k8s.cloudogu.com/reload-secrets"
      # To be used on ConfigMaps and Secrets. If the ConfigMap or Secret changes,
      # it will not trigger a restart of any workloads.
      # Value can be "true" or "false".
      ignore: "k8s.cloudogu.com/reload-ignore"
      # We do not support the following annotations officially, and they might not work in future revisions.
      # We overwrite them with our own annotations to stop people from using the original stakater annotations.
      # We recommend using the above annotations instead.
      search: "k8s.cloudogu.com/reload-search"
      match: "k8s.cloudogu.com/reload-match"
      pausePeriod: "k8s.cloudogu.com/reload-pause-period"
      pauseTime: "k8s.cloudogu.com/reload-paused-at"
    # use a more restrictive security context as it costs us nothing and is good practice
    deployment:
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
    # watch only namespaces that are listed here + the release namespace
    watchGlobally: false
    namespaces: []
    # enable prometheus metrics
    podMonitor:
      enabled: false
      labels:
        release: k8s-prometheus
