# This cluster role contains privileges necessary for applying helmfiles.
# Since we don't know what they'll contain, we give all permissions.
# The feature is only experimental and disabled by default, so for now, this is fine.

{{- if .Values.controllerManager.experimental.helmfileSupport.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: '{{ include "k8s-dogu-operator.name" . }}-helmfile-apply-cluster-role'
  labels:
    {{- include "k8s-dogu-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
{{- end }}