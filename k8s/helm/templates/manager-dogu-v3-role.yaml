{{- if .Values.controllerManager.env.doguV3Enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "k8s-dogu-operator.name" . }}-manager-dogu-v3-role
  labels:
    {{- include "k8s-dogu-operator.labels" . | nindent 4 }}
rules:
  # dogu v3: manage the OCIRepository (source-controller) that mirrors a dogu's chart artifact
  - apiGroups:
      - "source.toolkit.fluxcd.io"
    resources:
      - ocirepositories
    verbs:
      - create
      - list
      - get
      - watch
      - patch
      - delete
  - apiGroups:
      - "source.toolkit.fluxcd.io"
    resources:
      - ocirepositories/status
    verbs:
      - get
  # dogu v3: manage the HelmRelease (helm-controller) that installs a dogu's chart.
  - apiGroups:
      - "helm.toolkit.fluxcd.io"
    resources:
      - helmreleases
    verbs:
      - create
      - list
      - get
      - watch
      - patch
      - update
      - delete
  - apiGroups:
      - "helm.toolkit.fluxcd.io"
    resources:
      - helmreleases/status
    verbs:
      - get
  # dogu v3: discover a dogu's workloads to derive its health and restart them.
  # watch is needed for the caching kes-client
  # patch is needed to set the restart annotation via server-side apply
  # delete is needed for the pvc resize procedure
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
      - daemonsets
    verbs:
      - get
      - list
      - watch
      - patch
      - delete
  # read and grow a dogu's volumes.
  # watch is needed for the caching k8s-client
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch
      - patch
  # delete the pods that still mount a volume being resized; listed uncached, so no watch.
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - list
      - delete
  # dogu v3: read-only access so Helm `lookup` resolves during the chart validation render.
  # Namespaced on purpose: dogu charts may only `lookup` resources in their own (release)
  # namespace; cluster-scoped or cross-namespace lookups are unsupported and will fail validation.
  - apiGroups:
      - "*"
    resources:
      - "*"
    verbs:
      - get
      - list
{{- end }}
