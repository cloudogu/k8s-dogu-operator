apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "k8s-dogu-operator.name" . }}-manager-dogu-v3-role
  labels:
    {{- include "k8s-dogu-operator.labels" . | nindent 4 }}
rules:
  # dogu v3: manage ocirepositories for installing dogus. No delete permission is required, as ocirepositories are
  # deleted automatically by their owner reference.
  - apiGroups:
      - "source.toolkit.fluxcd.io"
    resources:
      - ocirepositories
    verbs:
      - create
      - list
      - get
      - watch
      - patch
  - apiGroups:
      - "source.toolkit.fluxcd.io"
    resources:
      - ocirepositories/status
    verbs:
      - get
  # dogu v3: manage helmreleases for installing dogus. No delete permission is required, as helmreleases are
  # deleted automatically by their owner reference.
  - apiGroups:
      - "helm.toolkit.fluxcd.io"
    resources:
      - helmreleases
    verbs:
      - create
      - list
      - get
      - watch
      - patch
  - apiGroups:
      - "helm.toolkit.fluxcd.io"
    resources:
      - helmreleases/status
    verbs:
      - get