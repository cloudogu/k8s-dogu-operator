{{- if .Values.controllerManager.env.doguV3Enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "k8s-dogu-operator.name" . }}-manager-dogu-v3-cluster-rolebinding
  labels:
    {{- include "k8s-dogu-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: '{{ include "k8s-dogu-operator.name" . }}-manager-dogu-v3-cluster-role'
subjects:
- kind: ServiceAccount
  name: '{{ include "k8s-dogu-operator.name" . }}-controller-manager'
  namespace: '{{ .Release.Namespace }}'
{{- end }}
