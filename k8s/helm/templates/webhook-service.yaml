apiVersion: v1
kind: Service
metadata:
  # This name is a fixed cross-repo contract with k8s-dogu-lib: the Dogu CRD's
  # spec.conversion.webhook.clientConfig.service points at exactly this name
  # (DOGU_CONVERSION_WEBHOOK_SERVICE_NAME in k8s-dogu-lib's Makefile), so it must NOT be derived
  # from the templated chart name / nameOverride.
  name: {{ include "k8s-dogu-operator.name" . }}-webhook
  labels:
    control-plane: controller-manager
    {{- include "k8s-dogu-operator.labels" . | nindent 4 }}
spec:
  publishNotReadyAddresses: true
  selector:
    control-plane: controller-manager
    {{- include "k8s-dogu-operator.selectorLabels" . | nindent 4 }}
  ports:
    - port: 443
      protocol: TCP
      targetPort: webhook-server
